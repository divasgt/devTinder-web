<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DevTinder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Theme bootstrap — runs before React mounts so the first paint
      // already has the right class on <html>. Avoids flash of wrong theme.
      // Mirrors what next-themes' ThemeProvider would compute client-side.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var systemDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = t === "dark" || t === "light" ? t : (systemDark ? "dark" : "light");
          document.documentElement.classList.add(resolved);
        } catch (e) {
          /* localStorage unavailable — fall through to CSS media query */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
